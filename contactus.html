<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style-contact.css">
    <title>ช่างคานดาวเทียมเขาใหญ่</title>
</head>
<body>
    
    <header>
        <div class="container-head">
            <div class="logo">
                <a href="#">ช่างคานดาวเทียมเขาใหญ่</a>
            </div>

            <div class="menu">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="contactus.html">Contact us</a></li>
                </ul>
            </div>
        </div>
    </header>

    <section class="container-upper-body">
        <div class="banner">
            <h1>ช่องทางการติดต่อ   </h1>
        </div>
       </section>

       <div class="container-contact">
        <div class="send-message">
        
            <form action="https://formsubmit.co/bbbew2005@gmail.com" method="POST">
                <label>ชื่อของคุณ:</label><br>
                <input type="text" name="name" required><br><br>
              
                <label>อีเมล:</label><br>
                <input type="email" name="email" required><br><br>
              
                <label>ข้อความ:</label><br>
                <textarea name="message" rows="5" required></textarea><br><br>
            
                <!-- ป้องกัน bot -->
                <input type="hidden" name="_captcha" value="false">
              
                <!-- หลังส่งแล้วไปหน้าไหน -->
                <input type="hidden" name="_next" value="contactus.html">
              
                <button type="submit">ส่งข้อความ</button>
              </form>
               

              
        </div>

       </div>
</body>
</html>
